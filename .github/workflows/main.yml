name: CI/CD Pipeline

on:
 push: 
  branches:
   - main

jobs:
 deployment:
  runs-on: ubuntu-latest
  steps:
  - name: Install ssh keys
    run: |
     install -m 600 -D /dev/null ~/.ssh/id_rsa
     echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
     ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
  - name: Connect & change directory 
    run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}
    
  # sync env file from Infisical
  - name: Sync env from Infisical
    run: |
     cd ${{ secrets.ENV_FOLDER }} 
     infisical export --silent --token=${{ secrets.INFISICAL_TOKEN }} > .env

  # pull image from hub and run command
  - name: Login Docker hub
    run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
  - name: Pull image from docker hub
    run: docker pull ${{ secrets.DOCKER_IMAGE }}
  - name: Rerun docker
    run: |
     cd ..
     docker-compose up -d

  #clean ssh session 
  - name: Clean up
    run: rm -rf ~/.ssh
