name: CI/CD Pipeline

on:
 push: 
  branches:
   - main

jobs:
 build_and_push_image:
  runs-on: ubuntu-latest
  outputs:
    image_tag: ${{ steps.set_tag.outputs.tag }}
  steps:
  - name: Checkout source
    uses: actions/checkout@v4
    with:
     fetch-depth: 0

  - name: Set image tag version
    id: set_tag
    run: echo "tag=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
    
  - name: Log in Dockerhub
    uses: docker/login-action@v3
    with:
     username: ${{ secrets.DOCKERHUB_USERNAME }}
     password: ${{ secrets.DOCKERHUB_PAT }}
     
  - name: Build and push Docker image
    uses: docker/build-push-action@v6
    with:
     context: .
     file: ./Dockerfile
     push: true
     tags: ${{ secrets.DOCKERHUB_REPO_NAME }}:${{ steps.set_tag.outputs.tag }}
     
 pull-and-deploy:
  runs-on: ubuntu-latest
  needs: build_and_push_image
  steps:
  - name: Install ssh keys
    run: |
     install -m 600 -D /dev/null ~/.ssh/id_rsa
     echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
     ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
    
  # sync env file from Infisical
  - name: Sync env from Infisical
    run: |
     ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
      cd ${{ secrets.WORKDIR }}/app_env 
      infisical export --silent --token=${{ secrets.INFISICAL_TOKEN }} > .env
     "

  # pull image from hub and run command for clear cache
  - name: Docker jobs [Login - Pull - Run - Logout]
    run: |
     ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
      cd ${{ secrets.WORKDIR }} 
      echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      docker pull ${{ secrets.DOCKERHUB_REPO_NAME }}:${{ needs.build_and_push_image.outputs.image_tag }}
      ./deploy.sh ${{ needs.build_and_push_image.outputs.image_tag }}
      docker logout
     "

  #clean ssh session 
  - name: Clean up ssh session
    run: rm -rf ~/.ssh
